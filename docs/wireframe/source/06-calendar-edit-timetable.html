<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Calendar – edit timetable</title>
<script src="2192306c-a871-4c0d-b473-661ced9f8072"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; box-sizing: border-box; background: #ffffff; color: #1f1f1f; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden;">

<header style="position: absolute; left: 0; top: 0; right: 0; height: 56px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #bdbdbd;">
<div style="display: flex; align-items: baseline; gap: 16px;">
<h1 style="margin: 0; font-size: 20px; font-weight: 600;">Calendar</h1>
<span style="font-size: 13px; color: #5c5c5c;">[SHORTCUT] opens / closes the overlay</span>
</div>
<div aria-label="Current time" style="padding: 6px 12px; border: 1px solid #1f1f1f; border-radius: 8px; font-size: 15px; font-variant-numeric: tabular-nums;">11:10</div>
</header>

<main style="position: absolute; left: 32px; right: 32px; top: 72px; bottom: 104px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<div style="display: flex; align-items: baseline; gap: 16px;">
<h2 style="margin: 0; font-size: 20px; font-weight: 600;">Edit timetable</h2>
<span style="font-size: 14px; color: #5c5c5c;">1. Pick a subject on the right · 2. Click slots to place it · click it again to clear</span>
</div>
<div style="display: flex; gap: 8px;">
<a href="Calendar.dc.html" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border: 1px solid #1f1f1f; border-radius: 8px; text-decoration: none; color: #1f1f1f; font-size: 14px;">Cancel</a>
<a href="Calendar.dc.html" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; background: #1f1f1f; border-radius: 8px; text-decoration: none; color: #ffffff; font-size: 14px; font-weight: 500;">Save timetable</a>
</div>
</div>

<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px;">
<section aria-label="Week grid" style="border: 1px solid #1f1f1f; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 0;">
<div style="display: flex; gap: 6px; height: 24px; align-items: center; font-size: 13px; font-weight: 600; color: #5c5c5c;">
<span style="width: 110px; flex-shrink: 0;">Lesson</span>
<span style="flex: 1 1 0; text-align: center;">Mon</span>
<span style="flex: 1 1 0; text-align: center;">Tue</span>
<span style="flex: 1 1 0; text-align: center;">Wed</span>
<span style="flex: 1 1 0; text-align: center;">Thu</span>
<span style="flex: 1 1 0; text-align: center;">Fri</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<div style="display: flex; gap: 6px; height: 48px;">
<span style="width: 110px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; font-size: 12px; color: #5c5c5c; font-variant-numeric: tabular-nums;"><span style="font-weight: 600; color: #1f1f1f;">{{r.n}}</span>{{r.time}}</span>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="5">
<button type="button" sc-camel-on-click="{{c.toggle}}" aria-label="{{c.aria}}" style="flex: 1 1 0; min-width: 0; height: 48px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{c.bg}}; border: {{c.border}}; border-radius: 8px; font: inherit; font-size: 13px; color: #1f1f1f; cursor: pointer;">
<span style="font-weight: 600;">{{c.subject}}</span>
<span style="font-size: 11px; color: #5c5c5c;">{{c.room}}</span>
</button>
</sc-for>
</div>
</sc-for>
</section>

<aside aria-label="Subjects" style="border: 1px solid #1f1f1f; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 0;">
<h3 style="margin: 0 0 4px; font-size: 16px; font-weight: 600;">Subjects</h3>
<sc-for list="{{subjects}}" as="s" hint-placeholder-count="7">
<button type="button" sc-camel-on-click="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 40px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; background: {{s.bg}}; border: {{s.border}}; border-radius: 8px; font: inherit; font-size: 14px; color: #1f1f1f; cursor: pointer;">
<span style="font-weight: 500;">{{s.name}}</span>
<span style="font-size: 12px; color: #5c5c5c;">{{s.room}}</span>
</button>
</sc-for>
<button type="button" style="height: 40px; margin-top: 4px; background: #ffffff; border: 1px dashed #1f1f1f; border-radius: 8px; font: inherit; font-size: 14px; color: #1f1f1f; cursor: pointer;">+ Add subject</button>
<div style="border-top: 1px solid #bdbdbd; margin: 8px 0 4px;"></div>
<h3 style="margin: 0; font-size: 16px; font-weight: 600;">Lesson times</h3>
<button type="button" style="height: 40px; background: #ffffff; border: 1px solid #1f1f1f; border-radius: 8px; font: inherit; font-size: 14px; color: #1f1f1f; cursor: pointer;">Edit lesson times</button>
</aside>
</div>
</main>

<nav aria-label="Main navigation" style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; background: #ffffff; border: 2px solid #1f1f1f; border-radius: 16px;">
<a href="Calendar.dc.html" aria-current="page" style="width: 80px; height: 56px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #e6e6e6; border: 2px solid #1f1f1f; border-radius: 10px; color: #1f1f1f; text-decoration: none; font-size: 12px; font-weight: 600;"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendar</a>
<a href="Tasks.dc.html" style="width: 80px; height: 56px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 2px solid transparent; border-radius: 10px; color: #1f1f1f; text-decoration: none; font-size: 12px;"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17"></path></svg>Tasks</a>
<a href="Main.dc.html" style="width: 80px; height: 56px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 2px solid transparent; border-radius: 10px; color: #1f1f1f; text-decoration: none; font-size: 12px;"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Home</a>
<a href="Applets.dc.html" style="width: 80px; height: 56px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 2px solid transparent; border-radius: 10px; color: #1f1f1f; text-decoration: none; font-size: 12px;"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Applets</a>
<a href="Settings.dc.html" style="width: 80px; height: 56px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 2px solid transparent; border-radius: 10px; color: #1f1f1f; text-decoration: none; font-size: 12px;"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Settings</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var ROOMS = { Mathe: 'R204', Englisch: 'R112', Deutsch: 'R108', 'Französisch': 'R110', Informatik: 'Lab 3', Wirtschaft: 'R301', Sport: 'Halle' };
    var SUBJECTS = ['Mathe', 'Englisch', 'Deutsch', 'Französisch', 'Informatik', 'Wirtschaft', 'Sport'];
    var TIMES = ['08:20–09:05', '09:10–09:55', '10:15–11:00', '11:05–11:50', '11:55–12:40', '13:15–14:00', '14:05–14:50', '15:05–15:50', '15:55–16:40'];
    var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
    var byDay = [
      ['Mathe', 'Deutsch', 'Englisch', '', '', 'Informatik', 'Informatik', '', ''],
      ['Englisch', 'Französisch', 'Mathe', 'Mathe', '', 'Deutsch', 'Sport', '', ''],
      ['Mathe', 'Mathe', 'Englisch', 'Informatik', '', 'Deutsch', 'Wirtschaft', '', ''],
      ['Informatik', 'Informatik', 'Französisch', 'Deutsch', '', '', '', '', ''],
      ['Wirtschaft', 'Englisch', 'Mathe', '', '', 'Sport', 'Sport', '', '']
    ];
    var st = this.state || {};
    var picked = st.picked || 'Mathe';
    var grid = st.grid || byDay;
    function toggle(d, s) {
      return function () {
        var g = grid.map(function (col) { return col.slice(); });
        g[d][s] = g[d][s] === picked ? '' : picked;
        self.setState({ grid: g });
      };
    }
    var rows = TIMES.map(function (time, s) {
      return {
        n: (s + 1) + '. lesson',
        time: time,
        cells: DAYS.map(function (day, d) {
          var v = grid[d][s];
          return {
            subject: v || '+',
            room: v ? ROOMS[v] : '',
            aria: day + ' lesson ' + (s + 1) + ': ' + (v || 'empty'),
            bg: v ? '#f2f2f2' : '#ffffff',
            border: v ? '1px solid #1f1f1f' : '1px dashed #bdbdbd',
            toggle: toggle(d, s)
          };
        })
      };
    });
    var subjects = SUBJECTS.map(function (name) {
      var on = name === picked;
      return {
        name: name, room: ROOMS[name], pressed: on ? 'true' : 'false',
        bg: on ? '#e6e6e6' : '#ffffff',
        border: on ? '2px solid #1f1f1f' : '1px solid #bdbdbd',
        pick: function () { self.setState({ picked: name }); }
      };
    });
    return { rows: rows, subjects: subjects };
  }
}
</script>


</body></html>
